name: "Apps: Test PR"

on: [pull_request]

jobs:
  test-apps:
    runs-on: ubuntu-latest
    container:
      image: ixsystems/catalog_validation:latest

    steps:
      - name: Install Helm
        run: /bin/bash -c "curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch base branch history
        run: git fetch origin main:main

      - name: Verify catalog validation tools
        run: |
          catalog_update --help
          catalog_validate --help

      - name: Generate catalog metadata
        run: catalog_update update --path "$GITHUB_WORKSPACE"

      - name: Validate catalog format
        run: |
          catalog_validate validate --path "$GITHUB_WORKSPACE"
          
      - name: Validate Helm charts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' chart; do
            helm lint --strict "$(dirname "$chart")"
          done < <(find library test -name Chart.yaml -print0)
